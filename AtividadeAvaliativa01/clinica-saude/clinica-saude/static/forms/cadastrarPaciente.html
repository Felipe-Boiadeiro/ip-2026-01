<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Paciente</title>
  <link rel="stylesheet" href="/static/styles/form.style.css">
</head>
<body>
  <div class="form-container">
    <div class="form-header green">
      <span>➕</span>
      <h1>Cadastrar Paciente</h1>
    </div>

    <form action="/api/cadastrar" method="POST">
      <div class="form-group">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="cpf">CPF *</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
        </div>
        <div class="form-group">
          <label for="data_nascimento">Data de Nascimento *</label>
          <input type="date" id="data_nascimento" name="data_nascimento" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(62) 99999-9999">
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="paciente@email.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tipo_sanguineo">Tipo Sanguíneo</label>
          <select id="tipo_sanguineo" name="tipo_sanguineo">
            <option value="">Selecione</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>
        <div class="form-group">
          <label for="convenio">Convênio</label>
          <input type="text" id="convenio" name="convenio" placeholder="Ex: Unimed, SUS">
        </div>
      </div>

      <div class="form-group">
        <label for="observacoes">Observações Médicas</label>
        <textarea id="observacoes" name="observacoes" rows="3" placeholder="Alergias, condições especiais..."></textarea>
      </div>

      <div class="form-actions">
        <a href="/" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary green">Cadastrar Paciente</button>
      </div>
    </form>
  </div>
</body>
</html>
