<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excluir Paciente</title>
  <link rel="stylesheet" href="/static/styles/form.style.css">
</head>
<body>
  <div class="form-container">
    <div class="form-header red">
      <span>🗑️</span>
      <h1>Excluir Paciente</h1>
    </div>

    <div class="warning-box">
      ⚠️ <strong>Atenção:</strong> Esta ação é irreversível. O paciente será permanentemente removido do sistema.
    </div>

    <form action="/api/excluir" method="POST">
      <div class="form-group">
        <label for="cpf">CPF do Paciente *</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
        <small>Informe o CPF do paciente que deseja excluir.</small>
      </div>

      <div class="form-actions">
        <a href="/" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary red">Excluir Paciente</button>
      </div>
    </form>
  </div>
</body>
</html>
